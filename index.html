<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1a1a1a">
<title>httpSMS</title>
<style>
*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
:root {
  --bg:#121212; --surf:#1e1e1e; --surf2:#2a2a2a; --surf3:#333;
  --border:#2e2e2e; --green:#4caf50; --green2:#388e3c; --green3:#1b5e20;
  --text:#ececec; --text2:#999; --text3:#555; --error:#ef5350;
  --ripple:rgba(255,255,255,0.07); --font:'Roboto','Segoe UI',system-ui,sans-serif;
}
html,body { height:100%; background:#000; font-family:var(--font); color:var(--text); overflow:hidden; }

.device {
  width:100%; max-width:390px; height:100dvh; max-height:844px;
  margin:0 auto; background:var(--bg);
  display:flex; flex-direction:column; overflow:hidden; position:relative;
}
@media (min-width:430px) {
  body { display:flex; align-items:center; justify-content:center; }
  .device { border-radius:44px; border:1px solid #2a2a2a; box-shadow:0 30px 80px rgba(0,0,0,0.8); }
}

.statusbar {
  background:var(--surf); height:28px;
  display:flex; align-items:center; justify-content:space-between;
  padding:0 20px; font-size:11px; font-weight:600; flex-shrink:0;
}
.statusbar-right { display:flex; gap:6px; align-items:center; }

.screen { display:none; flex-direction:column; flex:1; overflow:hidden; animation:fadein 0.18s ease; }
.screen.active { display:flex; }
@keyframes fadein { from { opacity:0; transform:translateX(10px); } to { opacity:1; transform:none; } }

.appbar {
  background:var(--surf); height:56px;
  display:flex; align-items:center; padding:0 4px 0 0;
  flex-shrink:0; border-bottom:1px solid var(--border); gap:0;
}
.appbar-title { font-size:20px; font-weight:500; flex:1; padding-left:16px; }
.appbar-titles { flex:1; padding-left:4px; min-width:0; }
.appbar-titles .title { font-size:17px; font-weight:500; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.appbar-titles .sub { font-size:12px; color:var(--text2); font-family:monospace; }

.icon-btn {
  width:44px; height:44px; border-radius:50%;
  background:none; border:none; color:var(--text);
  cursor:pointer; display:flex; align-items:center; justify-content:center;
  font-size:20px; transition:background 0.15s; flex-shrink:0;
}
.icon-btn:hover { background:var(--ripple); }
.icon-btn:active { background:rgba(255,255,255,0.13); }

/* sync indicator */
.sync-dot {
  width:8px; height:8px; border-radius:50%; background:var(--green);
  box-shadow:0 0 6px var(--green); animation:pulse 2s infinite; margin-right:4px;
}
.sync-dot.off { background:var(--text3); box-shadow:none; animation:none; }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }

/* conv list */
.conv-scroll { flex:1; overflow-y:auto; }
.conv-scroll::-webkit-scrollbar { width:3px; }
.conv-scroll::-webkit-scrollbar-thumb { background:var(--surf3); }

.empty { display:flex; flex-direction:column; align-items:center; justify-content:center; gap:12px; height:100%; color:var(--text3); text-align:center; padding:40px; }
.empty-icon { font-size:60px; }
.empty-text { font-size:15px; line-height:1.6; }

.conv-item { display:flex; align-items:center; gap:14px; padding:12px 16px; border-bottom:1px solid rgba(255,255,255,0.04); cursor:pointer; user-select:none; transition:background 0.12s; }
.conv-item:hover { background:var(--ripple); }
.conv-item:active { background:rgba(255,255,255,0.11); }
.conv-item.unread .conv-name { font-weight:700; color:#fff; }
.conv-item.unread .conv-preview { color:var(--text); }

.avatar { width:50px; height:50px; border-radius:50%; background:var(--green2); color:#fff; display:flex; align-items:center; justify-content:center; font-size:19px; font-weight:700; flex-shrink:0; text-transform:uppercase; }
.conv-body { flex:1; min-width:0; }
.conv-name { font-size:15px; font-weight:500; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.conv-preview { font-size:13px; color:var(--text2); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; margin-top:2px; }
.conv-time { font-size:11px; color:var(--text3); flex-shrink:0; margin-left:4px; }
.unread-badge { background:var(--green); color:#fff; font-size:11px; font-weight:700; border-radius:10px; padding:2px 7px; flex-shrink:0; }

.fab { position:absolute; bottom:20px; right:20px; width:56px; height:56px; border-radius:18px; background:var(--green); border:none; color:#fff; font-size:26px; cursor:pointer; display:flex; align-items:center; justify-content:center; box-shadow:0 4px 18px rgba(76,175,80,0.45); transition:all 0.18s; z-index:10; }
.fab:hover { background:#43a047; transform:scale(1.05); }
.fab:active { transform:scale(0.93); }

/* chat */
.chat-avatar { width:36px; height:36px; border-radius:50%; background:var(--green2); color:#fff; display:flex; align-items:center; justify-content:center; font-size:14px; font-weight:700; flex-shrink:0; margin-left:4px; text-transform:uppercase; }
.messages-area { flex:1; overflow-y:auto; padding:12px 10px 6px; display:flex; flex-direction:column; gap:4px; }
.messages-area::-webkit-scrollbar { width:3px; }

.msg-group { display:flex; flex-direction:column; margin-bottom:2px; }
.msg-group.out { align-items:flex-end; }
.msg-group.in { align-items:flex-start; }

.bubble { max-width:72%; padding:9px 13px; font-size:14px; line-height:1.55; word-break:break-word; }
.msg-group.out .bubble { background:var(--green3); color:#c8e6c9; border:1px solid #2e7d32; border-radius:18px 18px 4px 18px; }
.msg-group.in .bubble { background:var(--surf2); color:var(--text); border:1px solid var(--border); border-radius:18px 18px 18px 4px; }

.msg-meta { font-size:11px; color:var(--text3); margin-top:3px; padding:0 4px; display:flex; align-items:center; gap:3px; }
.tick { font-size:13px; }
.tick.sending { color:var(--text3); }
.tick.sent { color:var(--green); }
.tick.failed { color:var(--error); }

.compose { background:var(--surf); border-top:1px solid var(--border); padding:8px 8px 8px 10px; display:flex; align-items:flex-end; gap:8px; flex-shrink:0; }
.compose-wrap { flex:1; background:var(--surf2); border:1px solid var(--border); border-radius:24px; padding:10px 14px; display:flex; align-items:flex-end; transition:border-color 0.2s; }
.compose-wrap:focus-within { border-color:var(--green); }
.compose-input { flex:1; background:none; border:none; outline:none; color:var(--text); font-size:15px; font-family:var(--font); resize:none; min-height:22px; max-height:110px; line-height:1.45; }
.compose-input::placeholder { color:var(--text3); }
.send-btn { width:44px; height:44px; border-radius:50%; background:var(--green); border:none; color:#fff; font-size:19px; cursor:pointer; flex-shrink:0; display:flex; align-items:center; justify-content:center; transition:all 0.15s; }
.send-btn:hover { background:#43a047; }
.send-btn:active { transform:scale(0.9); }
.send-btn:disabled { background:var(--surf3); color:var(--text3); cursor:not-allowed; }

/* settings */
.settings-scroll { flex:1; overflow-y:auto; }
.section-label { font-size:11px; color:var(--green); letter-spacing:1.2px; text-transform:uppercase; padding:20px 20px 8px; font-weight:600; }
.setting-row { padding:14px 20px; border-bottom:1px solid rgba(255,255,255,0.04); }
.setting-label { font-size:12px; color:var(--text2); margin-bottom:7px; }
.setting-field { width:100%; background:var(--surf2); border:1px solid var(--border); border-radius:10px; padding:11px 14px; color:var(--text); font-size:14px; font-family:monospace; outline:none; transition:border-color 0.2s; }
.setting-field:focus { border-color:var(--green); }
.setting-field::placeholder { color:var(--text3); }

.chip-row { display:flex; flex-wrap:wrap; gap:8px; padding:12px 20px; border-bottom:1px solid rgba(255,255,255,0.04); }
.chip { padding:7px 16px; border-radius:20px; font-size:13px; border:1px solid var(--border); background:var(--surf2); color:var(--text2); cursor:pointer; font-family:monospace; transition:all 0.15s; }
.chip.active { background:var(--green2); border-color:var(--green); color:#fff; }

.add-row { display:flex; gap:8px; align-items:center; padding:12px 20px; border-bottom:1px solid rgba(255,255,255,0.04); }
.add-input { flex:1; background:var(--surf2); border:1px solid var(--border); border-radius:10px; padding:10px 14px; color:var(--text); font-size:13px; font-family:monospace; outline:none; transition:border-color 0.2s; }
.add-input:focus { border-color:var(--green); }
.add-input::placeholder { color:var(--text3); }
.add-btn { background:var(--surf3); border:none; color:var(--text); padding:10px 16px; border-radius:10px; font-size:13px; cursor:pointer; white-space:nowrap; }
.add-btn:hover { background:#444; }

.server-url { font-size:13px; color:var(--green); font-family:monospace; word-break:break-all; background:var(--surf2); padding:10px 14px; border-radius:10px; margin-top:6px; border:1px solid var(--border); }

.save-btn { margin:20px; width:calc(100% - 40px); background:var(--green); border:none; color:#fff; padding:15px; border-radius:14px; font-size:16px; font-weight:500; cursor:pointer; transition:background 0.15s; }
.save-btn:hover { background:#43a047; }

/* modal */
.overlay { display:none; position:absolute; inset:0; background:rgba(0,0,0,0.55); z-index:50; align-items:flex-end; }
.overlay.open { display:flex; animation:overin 0.2s ease; }
@keyframes overin { from{opacity:0} to{opacity:1} }
.sheet { background:var(--surf); border-radius:28px 28px 0 0; width:100%; padding:24px 20px 36px; display:flex; flex-direction:column; gap:14px; animation:sheetin 0.22s cubic-bezier(.32,1.2,.6,1); }
@keyframes sheetin { from{transform:translateY(100%)} to{transform:none} }
.sheet-title { font-size:18px; font-weight:500; }
.sheet-input { width:100%; background:var(--surf2); border:1px solid var(--border); border-radius:12px; padding:13px 16px; color:var(--text); font-size:15px; font-family:var(--font); outline:none; transition:border-color 0.2s; }
.sheet-input:focus { border-color:var(--green); }
.sheet-input::placeholder { color:var(--text3); }
.sheet-actions { display:flex; justify-content:flex-end; gap:8px; margin-top:4px; }
.btn-ghost { background:none; border:none; color:var(--text2); font-size:14px; padding:10px 16px; border-radius:8px; cursor:pointer; }
.btn-ghost:hover { background:var(--ripple); }
.btn-solid { background:var(--green); border:none; color:#fff; font-size:14px; padding:10px 22px; border-radius:8px; cursor:pointer; font-weight:500; }
.btn-solid:hover { background:#43a047; }

.snack { position:absolute; bottom:80px; left:50%; transform:translateX(-50%) translateY(12px); background:#323232; color:#fff; padding:11px 20px; border-radius:8px; font-size:13px; opacity:0; transition:all 0.25s; pointer-events:none; white-space:nowrap; z-index:99; max-width:320px; text-align:center; }
.snack.show { opacity:1; transform:translateX(-50%) translateY(0); }
.snack.ok { background:#2e7d32; }
.snack.err { background:#b71c1c; }

* { scrollbar-width:thin; scrollbar-color:var(--surf3) transparent; }
</style>
</head>
<body>
<div class="device">

  <div class="statusbar">
    <span id="clock">9:41</span>
    <div class="statusbar-right">
      <div class="sync-dot off" id="syncDot"></div>
      <span>●●●</span><span>🔋</span>
    </div>
  </div>

  <!-- ════ CONVERSATIONS ════ -->
  <div class="screen active" id="s-convs">
    <div class="appbar">
      <span class="appbar-title">httpSMS</span>
      <button class="icon-btn" onclick="syncNow()" title="Sync">🔄</button>
      <button class="icon-btn" onclick="openSettings()" title="Settings">⚙️</button>
    </div>
    <div class="conv-scroll" id="convScroll"></div>
    <button class="fab" onclick="openSheet()">✏️</button>
  </div>

  <!-- ════ CHAT ════ -->
  <div class="screen" id="s-chat">
    <div class="appbar">
      <button class="icon-btn" onclick="goBack()">←</button>
      <div class="chat-avatar" id="chatAvatar"></div>
      <div class="appbar-titles">
        <div class="title" id="chatTitle"></div>
        <div class="sub" id="chatSub"></div>
      </div>
      <button class="icon-btn" onclick="syncNow()" title="Sync">🔄</button>
    </div>
    <div class="messages-area" id="msgArea"></div>
    <div class="compose">
      <div class="compose-wrap">
        <textarea class="compose-input" id="composeInput" placeholder="Message" rows="1"></textarea>
      </div>
      <button class="send-btn" id="sendBtn" onclick="sendMsg()">▶</button>
    </div>
  </div>

  <!-- ════ SETTINGS ════ -->
  <div class="screen" id="s-settings">
    <div class="appbar">
      <button class="icon-btn" onclick="saveSettings()">←</button>
      <span class="appbar-title">Settings</span>
    </div>
    <div class="settings-scroll">
      <div class="section-label">API</div>
      <div class="setting-row">
        <div class="setting-label">API Key</div>
        <input class="setting-field" type="password" id="apiKeyField" placeholder="uk_xxxxxxxxxxxxxxxx" autocomplete="off" />
      </div>

      <div class="section-label">Webhook</div>
      <div class="setting-row">
        <div class="setting-label">Set this URL in httpsms.com → Webhooks</div>
        <div class="server-url" id="webhookUrl">Loading...</div>
      </div>

      <div class="section-label">Send From</div>
      <div class="chip-row" id="chipRow"></div>

      <div class="section-label">Add Number</div>
      <div class="add-row">
        <input class="add-input" type="tel" id="addNumField" placeholder="+8801XXXXXXXXX" />
        <button class="add-btn" onclick="addNumber()">Add</button>
      </div>

      <button class="save-btn" onclick="saveSettings()">Save Settings</button>
    </div>
  </div>

  <!-- New chat sheet -->
  <div class="overlay" id="overlay" onclick="closeSheet(event)">
    <div class="sheet">
      <div class="sheet-title">New message</div>
      <input class="sheet-input" type="tel" id="sheetNum" placeholder="Phone number (+880...)" />
      <input class="sheet-input" type="text" id="sheetName" placeholder="Name (optional)" />
      <div class="sheet-actions">
        <button class="btn-ghost" onclick="closeSheet()">Cancel</button>
        <button class="btn-solid" onclick="startConv()">Start</button>
      </div>
    </div>
  </div>

  <div class="snack" id="snack"></div>
</div>

<script>
// ══════════════════════════════════════
//  STATE
// ══════════════════════════════════════
let S = {
  apiKey: '',
  fromNumber: '',
  numbers: ['+8801788656714', '+8801804998282'],
  conversations: {},
  active: null,
};

const BASE = window.location.origin; // same server

function persist() {
  const { apiKey, ...rest } = S;
  localStorage.setItem('hsms_data', JSON.stringify(rest));
  localStorage.setItem('hsms_key', apiKey);
  // push to server
  fetch('/api/messages', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ conversations: S.conversations })
  }).catch(()=>{});
}

function hydrate() {
  try {
    const d = localStorage.getItem('hsms_data');
    if (d) Object.assign(S, JSON.parse(d));
    S.apiKey = localStorage.getItem('hsms_key') || '';
  } catch(e){}
  if (!S.fromNumber && S.numbers.length) S.fromNumber = S.numbers[0];
}

// ══════════════════════════════════════
//  SYNC from server
// ══════════════════════════════════════
async function syncNow(silent=false) {
  const dot = document.getElementById('syncDot');
  dot.classList.remove('off');
  try {
    const res = await fetch('/api/messages');
    const data = await res.json();
    if (data.conversations) {
      // Merge server conversations into local state
      Object.entries(data.conversations).forEach(([num, conv]) => {
        if (!S.conversations[num]) {
          S.conversations[num] = conv;
        } else {
          // Merge messages by id, avoiding duplicates
          const existing = new Set(S.conversations[num].messages.map(m => m.id));
          conv.messages.forEach(m => {
            if (!existing.has(m.id)) {
              S.conversations[num].messages.push(m);
            }
          });
          // Sort by timestamp
          S.conversations[num].messages.sort((a,b) => a.ts - b.ts);
        }
      });
      const { apiKey, ...rest } = S;
      localStorage.setItem('hsms_data', JSON.stringify(rest));
      renderConvs();
      if (S.active) renderMsgs();
      if (!silent) snack('Synced ✓', 'ok');
    }
  } catch(e) {
    if (!silent) snack('Sync failed — is server running?', 'err');
  }
  setTimeout(() => dot.classList.add('off'), 1500);
}

// Auto sync every 10 seconds when on chat screen
setInterval(() => {
  if (document.getElementById('s-chat').classList.contains('active')) {
    syncNow(true);
  }
}, 10000);

// ══════════════════════════════════════
//  NAVIGATION
// ══════════════════════════════════════
function show(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}
function goBack() { show('s-convs'); renderConvs(); }

function openSettings() {
  document.getElementById('apiKeyField').value = S.apiKey;
  document.getElementById('webhookUrl').textContent = BASE + '/webhook';
  renderChips();
  show('s-settings');
}

function saveSettings() {
  const k = document.getElementById('apiKeyField').value.trim();
  if (k) S.apiKey = k;
  localStorage.setItem('hsms_key', S.apiKey);
  persist();
  snack('Settings saved ✓', 'ok');
  setTimeout(() => { show('s-convs'); renderConvs(); }, 500);
}

// ══════════════════════════════════════
//  CHIPS
// ══════════════════════════════════════
function renderChips() {
  const row = document.getElementById('chipRow');
  row.innerHTML = '';
  S.numbers.forEach(n => {
    const c = document.createElement('div');
    c.className = 'chip' + (n === S.fromNumber ? ' active' : '');
    c.textContent = n;
    c.onclick = () => { S.fromNumber = n; persist(); renderChips(); };
    row.appendChild(c);
  });
}
function addNumber() {
  const n = document.getElementById('addNumField').value.trim();
  if (!n) return;
  if (!S.numbers.includes(n)) { S.numbers.push(n); persist(); }
  document.getElementById('addNumField').value = '';
  renderChips();
}

// ══════════════════════════════════════
//  CONVERSATIONS
// ══════════════════════════════════════
function renderConvs() {
  const el = document.getElementById('convScroll');
  const convs = Object.values(S.conversations)
    .sort((a,b) => (b.messages.at(-1)?.ts||0) - (a.messages.at(-1)?.ts||0));

  if (!convs.length) {
    el.innerHTML = `<div class="empty"><div class="empty-icon">💬</div><div class="empty-text">No conversations yet.<br>Tap ✏️ to start one.</div></div>`;
    return;
  }
  el.innerHTML = '';
  convs.forEach(conv => {
    const last = conv.messages.at(-1);
    const unreadCount = conv.messages.filter(m => m.dir === 'in' && !m.read).length;
    const div = document.createElement('div');
    div.className = 'conv-item' + (unreadCount ? ' unread' : '');
    div.onclick = () => openChat(conv.number);
    div.innerHTML = `
      <div class="avatar">${initials(conv)}</div>
      <div class="conv-body">
        <div class="conv-name">${esc(conv.name || conv.number)}</div>
        <div class="conv-preview">${last ? (last.dir==='out'?'You: ':'') + esc(last.text) : ''}</div>
      </div>
      <div style="display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex-shrink:0;">
        <div class="conv-time">${last ? timeAgo(last.ts) : ''}</div>
        ${unreadCount ? `<div class="unread-badge">${unreadCount}</div>` : ''}
      </div>
    `;
    el.appendChild(div);
  });
}

// ══════════════════════════════════════
//  NEW CHAT
// ══════════════════════════════════════
function openSheet() {
  document.getElementById('sheetNum').value = '';
  document.getElementById('sheetName').value = '';
  document.getElementById('overlay').classList.add('open');
  setTimeout(() => document.getElementById('sheetNum').focus(), 200);
}
function closeSheet(e) {
  if (e && e.target !== document.getElementById('overlay')) return;
  document.getElementById('overlay').classList.remove('open');
}
function startConv() {
  const num = document.getElementById('sheetNum').value.trim();
  const name = document.getElementById('sheetName').value.trim();
  if (!num) return snack('Enter a phone number', 'err');
  if (!S.conversations[num]) S.conversations[num] = { number:num, name, messages:[] };
  else if (name) S.conversations[num].name = name;
  persist();
  document.getElementById('overlay').classList.remove('open');
  openChat(num);
}

// ══════════════════════════════════════
//  CHAT
// ══════════════════════════════════════
function openChat(num) {
  S.active = num;
  const conv = S.conversations[num];
  // Mark incoming as read
  conv.messages.forEach(m => { if (m.dir === 'in') m.read = true; });
  persist();
  document.getElementById('chatTitle').textContent = conv.name || num;
  document.getElementById('chatSub').textContent = num;
  document.getElementById('chatAvatar').textContent = initials(conv);
  renderMsgs();
  show('s-chat');
  scrollBottom();
  syncNow(true);
}

function renderMsgs() {
  const conv = S.conversations[S.active];
  const area = document.getElementById('msgArea');
  area.innerHTML = '';
  if (!conv?.messages.length) {
    area.innerHTML = '<div style="text-align:center;color:var(--text3);padding:48px 20px;font-size:14px;">No messages yet. Say hello 👋</div>';
    return;
  }
  conv.messages.forEach(m => {
    const g = document.createElement('div');
    g.className = 'msg-group ' + (m.dir === 'out' ? 'out' : 'in');
    const tick = m.dir === 'out'
      ? `<span class="tick ${m.status}">${m.status==='sending'?'⏳':m.status==='sent'?'✓':'✗'}</span>`
      : '';
    g.innerHTML = `
      <div class="bubble">${esc(m.text)}</div>
      <div class="msg-meta">${tick}<span>${fmt(m.ts)}</span></div>
    `;
    area.appendChild(g);
  });
}

function scrollBottom() {
  setTimeout(() => {
    const a = document.getElementById('msgArea');
    a.scrollTop = a.scrollHeight;
  }, 40);
}

async function sendMsg() {
  if (!S.apiKey) { snack('Add your API key in Settings ⚙️', 'err'); return; }
  const input = document.getElementById('composeInput');
  const text = input.value.trim();
  if (!text) return;

  const conv = S.conversations[S.active];
  const msg = { id: Date.now().toString(), dir:'out', text, ts:Date.now(), status:'sending' };
  conv.messages.push(msg);
  persist();
  renderMsgs();
  scrollBottom();
  input.value = '';
  input.style.height = 'auto';
  document.getElementById('sendBtn').disabled = true;

  try {
    const res = await fetch('https://api.httpsms.com/v1/messages/send', {
      method:'POST',
      headers:{'x-api-key':S.apiKey,'Content-Type':'application/json'},
      body:JSON.stringify({ content:text, from:S.fromNumber, to:S.active })
    });
    const data = await res.json();
    msg.status = res.ok ? 'sent' : 'failed';
    if (!res.ok) snack(data.message || 'Failed to send', 'err');
  } catch(e) {
    msg.status = 'failed';
    snack('Network error', 'err');
  }

  persist();
  renderMsgs();
  scrollBottom();
  document.getElementById('sendBtn').disabled = false;
}

// ══════════════════════════════════════
//  HELPERS
// ══════════════════════════════════════
function initials(conv) {
  const s = conv.name || conv.number || '?';
  return s.replace(/^\+880/,'').slice(0,2).toUpperCase();
}
function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function fmt(ts) {
  return new Date(ts).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
}
function timeAgo(ts) {
  const diff = Date.now()-ts;
  if (diff<60000) return 'now';
  if (diff<3600000) return Math.floor(diff/60000)+'m';
  if (diff<86400000) return Math.floor(diff/3600000)+'h';
  return new Date(ts).toLocaleDateString([],{month:'short',day:'numeric'});
}

const ci = document.getElementById('composeInput');
ci.addEventListener('input',()=>{ ci.style.height='auto'; ci.style.height=Math.min(ci.scrollHeight,110)+'px'; });
ci.addEventListener('keydown',e=>{ if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMsg();} });

function snack(msg,type='') {
  const el=document.getElementById('snack');
  el.textContent=msg; el.className='snack show '+type;
  clearTimeout(el._t); el._t=setTimeout(()=>el.className='snack',3000);
}

function updateClock() {
  document.getElementById('clock').textContent=new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
}
updateClock(); setInterval(updateClock,10000);

// ── Boot ──
hydrate();
renderConvs();
syncNow(true);
if (!S.apiKey) setTimeout(()=>snack('Open ⚙️ Settings to add your API key'),900);
</script>
